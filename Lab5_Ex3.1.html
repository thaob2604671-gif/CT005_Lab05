<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nhiệm vụ 2.2 | Infographic và video</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; padding: 32px 16px; background: #f1f6fa; color: #203447; font: 16px/1.6 Arial, sans-serif; }
		main { max-width: 960px; margin: auto; }
		header, section { margin-bottom: 24px; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 4px 18px #20344712; }
		h1, h2 { margin-top: 0; color: #126782; }
		img { display: block; width: 100%; height: auto; border-radius: 8px; }
		.video { position: relative; width: 100%; padding-bottom: 56.25%; }
		iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 8px; }
		footer { color: #586b7b; font-size: .9rem; text-align: center; }
	</style>
</head>
<body>
	<main>
		<header>
			<h1>Nhiệm vụ 2.2: Infographic và video</h1>
			<p>Infographic dưới đây trình bày nội dung trực quan của bài tập. Xem video để tham khảo thêm.</p>
		</header>
		<section aria-labelledby="infographic-heading">
			<h2 id="infographic-heading">Infographic</h2>
			<img src="Lab05_Ex2.1.png" alt="Infographic minh họa nội dung Nhiệm vụ 2.2">
		</section>
		<section aria-labelledby="video-heading">
			<h2 id="video-heading">Video YouTube</h2>
			<div class="video">
				<iframe src="https://www.youtube.com/embed/-3gOpd7Rv-A" title="Video minh họa Nhiệm vụ 2.2" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
			</div>
		</section>
		<footer>Infographic: tệp Lab05_Ex2.1.png. Video nhúng từ YouTube; bản quyền nội dung thuộc về các chủ sở hữu tương ứng.</footer>
	</main>
</body>
</html>
